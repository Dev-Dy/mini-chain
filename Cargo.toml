# ============================================================================
# Cargo Manifest for Mini Blockchain
# ============================================================================
[package]
name = "mini_chain"
version = "0.1.0"
edition = "2021"
authors = ["Dheeraj"]
description = "A minimalist blockchain implementation in Rust."
repository = "https://github.com/dev-dy/mini_chain"
license = "MIT"

[dependencies]
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
